<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/styles/communities.css">
        <link rel="stylesheet" href="/styles/navbar.css">
        <script>
            let communities = []
            let filtered = []

            function showCommunities() {
                var div = document.getElementById('community-list')
                div.innerHTML = ''
                for(var community of filtered){
                    div.innerHTML = `<div class='community-card' onclick="openCommunity('${community.name}')"><div class='community-name'><h3>${community.name}</h3></div><div class='community-description'><p>${community.description}</p></div></div>` + div.innerHTML
                }
            }

            //show all communities in the list
            async function getCommunities() {
                await fetch('/communities')
                .then((res) => {return res.json()})
                .then((data) => {
                    communities = []
                    for (var community of data) {
                        communities.push(community);
                    }
                    filtered = communities
                    showCommunities();
                })
                .catch((error) => {console.log(error)})
            }



            //
            async function openCommunity(name) {
                window.location.href = `/postspage/${name}`
            }

            //Display pop up form
            function openForm() {
                document.getElementById("popup").style.display = "block"
                document.getElementById('form-error').textContent = ''
            }

            //submit the form and load new communities
            async function submitForm(e){
                e.preventDefault()
                const res = await fetch('/communities/create',{
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: document.getElementById('name').value.trim().replaceAll(' ', '_'),
                        description: document.getElementById('description').value.trim()
                    })
                })
                const data = await res.json()
                if (data.error) {
                    document.getElementById('form-error').textContent = data.error
                } else {
                    closeForm();
                }
            }

            //close the form
            function closeForm() {
                getCommunities();
                filterCommunities();
                document.getElementById('popup').style.display = 'none';
            }

            function filterCommunities() {
                const value = document.getElementById('communities-search').value
                filtered = communities
                filtered = filtered.filter(c => c.name.toLowerCase().includes(value));
                showCommunities();
            }
        </script>
    </head>
    <body onload="getCommunities()">

        <nav>
            <div id="nav-links"></div>
        </nav>

        <div>
        <div id="header">
            <h1>Communities R Us</h1>
            <button id="community-button" onclick="openForm()">Create Community</button>
            <input oninput="filterCommunities()" type="text" id="communities-search" placeholder="Search">
        </div>

        <!--Pop up form to make community-->
        <div id="popup" style="display: none;">
            <form onsubmit="submitForm(event)">
                <label class="community-label">
                    Name:
                    <input name="name" type="text" id="name" required placeholder="Community Name">
                    <br>
                </label>
                <label class="community-label">
                    Description
                    <input type="text" name="description" id="description" placeholder="Description">
                    <br>
                </label>
                <p id="form-error" style="color: red;"></p>
                <button type="submit">Submit</button>
            </form>
        </div>

        <!--List of all communities-->


        <div id="community-list"></div>

        <script src="../scripts/navbar.js"></script>
    </body>
</html>
